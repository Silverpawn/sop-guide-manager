<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siemens Energy • Lean@GS Documentation — SOPs, Guides &amp; Reference</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Row 1: Official Siemens Energy Brand Gradient Header (#1B1534 -> #4D217A) -->
  <header class="top-header">
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
      <div class="brand-lockup" onclick="showOverview()">
        <span class="petrol-dot" aria-hidden="true"></span>
        <span class="se-wordmark">SIEMENS ENERGY</span>
        <span class="lean-pill">LEAN@GS</span>
        <span class="doc-badge">DOCUMENTATION</span>
      </div>

      <!-- Global Playbook Switcher Dropdown (100% JSON-Driven) -->
      <div class="playbook-switcher-wrap">
        <label for="playbookSelect" class="playbook-switcher-label">PLAYBOOK:</label>
        <select id="playbookSelect" class="playbook-select" aria-label="Select Active Lean@GS Playbook"></select>
      </div>
    </div>

    <div class="header-right">
      <div class="search-wrapper">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          aria-label="Search active playbook guides, steps, tools, or reference tables"
          placeholder="Search active playbook..."
        />
        <span class="search-slash" aria-hidden="true">/</span>
      </div>
      <button type="button" class="header-btn secondary" onclick="window.print()">Print Guide</button>
      <button
        type="button"
        class="admin-gear-btn"
        id="openBuilderBtn"
        title="Admin: Manage Guide Data (JSON)"
        aria-label="Admin: Manage Guide Data"
      >
        ⚙️
      </button>
    </div>
  </header>

  <!-- Signature Siemens Energy Fading Petrol Line -->
  <div class="se-fading-line" aria-hidden="true"></div>

  <!-- Row 2: 4 Universal Top Navigation Tabs (Playbook-Agnostic Labels + Dynamic JSON Subtitles) -->
  <nav class="sub-navbar" id="topCategoryBar" aria-label="Playbook Navigation Categories">
    <button type="button" class="sub-tab active" data-tab="journey" onclick="switchTopTab('journey')">
      1. End-to-End Journey
    </button>
    <button type="button" class="sub-tab" data-tab="guides" onclick="switchTopTab('guides')">
      2. Step-by-Step Guides
    </button>
    <button type="button" class="sub-tab" data-tab="decision" onclick="switchTopTab('decision')">
      3. Decision &amp; Priority Tools
    </button>
    <button type="button" class="sub-tab" data-tab="templates" onclick="switchTopTab('templates')">
      4. Templates &amp; Reference
    </button>
  </nav>

  <!-- Main 2-Column Layout on Generous Siemens Energy White Canvas -->
  <div class="portal-layout">
    <aside class="left-sidebar" id="leftSidebar"></aside>
    <main class="content-stage" id="mainCanvas"></main>
  </div>

  <!-- Guide Authoring Studio & JSON Manager Modal (Hidden Behind Gear Icon) -->
  <div id="jsonModal" class="modal-backdrop hidden">
    <div class="modal-dialog studio-modal-dialog">
      <div class="modal-top">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <strong>⚙️ Lean@GS Guide Authoring Studio &amp; M365 Manager</strong>
          <div class="studio-tab-group" role="tablist">
            <button type="button" class="studio-tab-btn active" id="tabBtnStudioVisual" onclick="switchStudioTab('visual')">
              Tab A: Visual Step &amp; Screenshot Editor (No-Code)
            </button>
            <button type="button" class="studio-tab-btn" id="tabBtnStudioRaw" onclick="switchStudioTab('raw')">
              Tab B: Raw JSON Payload Loader
            </button>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button type="button" class="header-btn" onclick="downloadUpdatedGuidesJson()" title="Download complete guides.json for SharePoint, OneDrive, or Git">
            ⬇ Download Updated guides.json
          </button>
          <button type="button" class="header-btn secondary" id="closeModalBtn">Close ✕</button>
        </div>
      </div>

      <!-- TAB A: No-Code Visual Step & Screenshot Authoring Studio -->
      <div id="studioTabVisual" class="studio-body">
        <div class="studio-selectors-bar">
          <div class="studio-field-inline">
            <label for="studioPlaybookSelect">Playbook:</label>
            <select id="studioPlaybookSelect" class="studio-select" onchange="onStudioPlaybookChange(this.value)"></select>
          </div>
          <div class="studio-field-inline">
            <label for="studioSopSelect">SOP Guide:</label>
            <select id="studioSopSelect" class="studio-select" onchange="onStudioSopChange(this.value)"></select>
          </div>
          <div class="studio-field-inline">
            <label for="studioStepSelect">Step:</label>
            <select id="studioStepSelect" class="studio-select" onchange="onStudioStepChange(this.value)"></select>
          </div>
          <button type="button" class="header-btn" style="background:#009999;" onclick="addNewSopStepInStudio()">
            + New SOP Step
          </button>
        </div>

        <div class="studio-grid">
          <!-- Left Column: Step Text, Guardrails, Coaching Tip & Visual Mode Radio Pills -->
          <div class="studio-col">
            <div class="studio-label-row">
              <label for="studioActionInput" class="studio-label">1. Step Action Command (Max 20 Words • Active Verb):</label>
              <span id="studioWordCounterPill" class="studio-guardrail-pill">0 / 20 words</span>
            </div>
            <input
              type="text"
              id="studioActionInput"
              class="studio-input"
              placeholder="e.g., Click 'Export Plan' and save the file in 600 Maturity Submissions."
              oninput="onStudioStepFieldInput()"
            />
            <div id="studioGuardrailFeedback" class="studio-guardrail-feedback"></div>

            <label for="studioDetailInput" class="studio-label" style="margin-top:12px;">2. Supporting Context / Detail (Optional):</label>
            <input
              type="text"
              id="studioDetailInput"
              class="studio-input"
              placeholder="Short plain-English context for this step..."
              oninput="onStudioStepFieldInput()"
            />

            <label for="studioCoachingInput" class="studio-label" style="margin-top:12px;">3. Good Practice Coaching Tip (Required Value-Add):</label>
            <textarea
              id="studioCoachingInput"
              class="studio-textarea"
              rows="2"
              placeholder="Why this step matters or how to avoid a common mistake..."
              oninput="onStudioStepFieldInput()"
            ></textarea>

            <div class="studio-label" style="margin-top:14px;">4. Visual Mode for This Step:</div>
            <div class="studio-mode-pills" role="radiogroup" aria-label="Step Visual Mode">
              <button type="button" class="studio-mode-pill" id="modePillNone" onclick="setStudioVisualMode('none')">
                📝 No Image (Text + Coaching Only)
              </button>
              <button type="button" class="studio-mode-pill" id="modePillImage" onclick="setStudioVisualMode('image')">
                📸 Custom Screenshot (Paste Ctrl+V / Upload)
              </button>
              <button type="button" class="studio-mode-pill" id="modePillSvg" onclick="setStudioVisualMode('svg')">
                📐 Built-in UI Diagram (Declarative SVG)
              </button>
            </div>

            <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid #D7E4EE;">
              <button type="button" class="header-btn secondary" style="color:#1B1534;border-color:#B8CEDB;" onclick="resetSavedLocalStorageGuides()">
                ↺ Reset Local Browser Edits
              </button>
              <button type="button" class="header-btn" style="padding:10px 20px;font-size:13.5px;" onclick="saveStudioStepChanges()">
                ✓ Save &amp; Apply to Live Guide
              </button>
            </div>
          </div>

          <!-- Right Column: Interactive Screenshot Dropzone (Ctrl+V) & Click-to-Place Hotspot Canvas -->
          <div class="studio-col" id="studioVisualRightCol"></div>
        </div>
      </div>

      <!-- TAB B: Raw JSON Payload Loader -->
      <div id="studioTabRaw" class="modal-grid hidden">
        <div>
          <textarea id="jsonEditor" class="code-editor" spellcheck="false" aria-label="JSON Payload Editor"></textarea>
        </div>
        <div style="display:flex;flex-direction:column;justify-content:space-between;">
          <div>
            <h4 style="margin-bottom:10px;color:#1B1534;">Schema &amp; Usability Audit</h4>
            <div id="liveAuditReport" style="font-size:13.5px;color:#54646E;"></div>
            <div style="margin-top:16px;">
              <label for="jsonFileInput" style="font-size:12.5px;font-weight:600;color:#1B1534;display:block;margin-bottom:6px;">
                Upload JSON File:
              </label>
              <input type="file" id="jsonFileInput" accept=".json" style="font-size:12px;color:#54646E;" />
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button type="button" class="header-btn secondary" style="color:#1B1534;border-color:#B8CEDB;padding:9px;" onclick="resetSavedLocalStorageGuides()">
              ↺ Reset to Default Payload
            </button>
            <button type="button" class="header-btn" id="applyJsonBtn" style="padding:11px;font-size:13.5px;">
              Apply Raw JSON Changes
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="data/fallback-db.js"></script>
  <script src="app.js"></script>
</body>
</html>
